# Ollama settings for the AI container. Installed to /etc/systemd/system/ollama.service.d/override.conf
# by scripts/bootstrap.sh. See README.md for the reasoning behind each value.
[Service]
# Listen on the LAN, not just localhost. There is no auth, so never expose this port to the internet.
Environment="OLLAMA_HOST=0.0.0.0:11434"
# How long an idle model stays in RAM. Measured on this box: a loaded idle model costs ~0.25 W, while
# reloading gemma costs ~708 J (42 s at ~17 W). Break-even is ~47 min, so 30m is close to power-optimal.
Environment="OLLAMA_KEEP_ALIVE=30m"
# Default context window. 8k keeps the KV cache small enough for both models to fit in 24 GB.
Environment="OLLAMA_CONTEXT_LENGTH=8192"
# Lower memory use and faster prompt reading on CPU.
Environment="OLLAMA_FLASH_ATTENTION=1"
# One request per model at a time: on 4 cores, parallel requests just slow each other down.
Environment="OLLAMA_NUM_PARALLEL=1"
