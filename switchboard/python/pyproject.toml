[project]
name = "switchboard"
version = "0.1.0"
description = "Ask for AI jobs, not models: routes chat/classify to the mini PC's Ollama (local) or a frontier API (nonlocal) via LiteLLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.110,<2",   # 1.110 added litellm.systemone(), used for tev1
    "python-dotenv>=1.0",
    "tenacity>=8",         # LiteLLM needs it for num_retries but doesn't install it
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to the real mini PC (run with SWITCHBOARD_LIVE=1)"]
filterwarnings = ["ignore:.*ReadOnly.*:UserWarning"]  # noise from LiteLLM's pydantic types
